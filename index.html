<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>AdminPro UAE — HR &amp; Fleet Management</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css"/>

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}

/* ═══ TOKENS ═══ */
:root,[data-theme="dark"]{
  --bg:#0d1117;--bg2:#161b22;--bg3:#1c2333;
  --surface:#21262d;--surface2:#2d333b;
  --border:#30363d;--border2:#444c56;
  --text:#e6edf3;--text2:#8b949e;--text3:#6e7681;
  --accent:#58a6ff;--accent-dim:rgba(88,166,255,.12);--accent-glow:rgba(88,166,255,.28);
  --teal:#39d353;--teal-dim:rgba(57,211,83,.12);
  --amber:#e3b341;--amber-dim:rgba(227,179,65,.12);
  --red:#f85149;--red-dim:rgba(248,81,73,.12);
  --purple:#a371f7;--purple-dim:rgba(163,113,247,.12);
  --orange:#f0883e;--orange-dim:rgba(240,136,62,.12);
  --icon-bar-w:56px;--sub-bar-w:220px;
  --topbar-h:56px;
  --radius:8px;--radius-lg:12px;--radius-xl:16px;
  --font:'Sora',sans-serif;--mono:'JetBrains Mono',monospace;
  --shadow:0 1px 3px rgba(0,0,0,.4);
  --shadow-md:0 4px 16px rgba(0,0,0,.5);
  --shadow-lg:0 8px 32px rgba(0,0,0,.6);
}
[data-theme="light"]{
  --bg:#f0f2f5;--bg2:#ffffff;--bg3:#e8ecf0;
  --surface:#ffffff;--surface2:#e2e7ed;
  --border:#c8d0d9;--border2:#9aa5b1;
  --text:#0d1117;--text2:#3d454f;--text3:#5a6370;
  --accent:#0550ae;--accent-dim:rgba(5,80,174,.12);--accent-glow:rgba(5,80,174,.22);
  --teal:#116329;--teal-dim:rgba(17,99,41,.13);
  --amber:#7d4e00;--amber-dim:rgba(125,78,0,.13);
  --red:#a8111b;--red-dim:rgba(168,17,27,.11);
  --purple:#6639c8;--purple-dim:rgba(102,57,200,.13);
  --orange:#953800;--orange-dim:rgba(149,56,0,.13);
  --shadow:0 1px 3px rgba(0,0,0,.10);
  --shadow-md:0 4px 16px rgba(0,0,0,.12);
  --shadow-lg:0 8px 32px rgba(0,0,0,.15);
}

html,body{height:100%;font-family:var(--font);background:var(--bg);color:var(--text);font-size:14px;-webkit-font-smoothing:antialiased;}

/* ═══ SHELL ═══ */
.shell{display:flex;flex-direction:column;height:100vh;overflow:hidden;}

/* ═══ TOPBAR ═══ */
.topbar{
  height:var(--topbar-h);
  background:var(--bg2);
  border-bottom:1px solid var(--border);
  display:flex;align-items:stretch;
  flex-shrink:0;position:relative;z-index:200;
  /* subtle accent line at very top */
}
.topbar::before{
  content:'';position:absolute;top:0;left:0;right:0;height:2px;
  background:linear-gradient(90deg,var(--accent) 0%,var(--purple) 40%,var(--teal) 100%);
  opacity:.7;
}

/* ── Brand zone (aligns with icon bar) ── */
.tb-brand{
  width:var(--icon-bar-w);
  display:flex;align-items:center;justify-content:center;
  border-right:1px solid var(--border);flex-shrink:0;
  background:linear-gradient(160deg,rgba(88,166,255,.06) 0%,transparent 100%);
}
.tb-brand-icon{
  width:32px;height:32px;
  background:linear-gradient(135deg,var(--accent) 0%,#1f6feb 100%);
  border-radius:9px;
  display:flex;align-items:center;justify-content:center;
  color:#fff;font-size:15px;
  box-shadow:0 0 14px var(--accent-glow),0 2px 4px rgba(0,0,0,.3);
  transition:box-shadow .2s;
}
.tb-brand-icon:hover{box-shadow:0 0 22px var(--accent-glow),0 2px 8px rgba(0,0,0,.4);}

/* ── App title (aligns with sub-bar) ── */
.tb-app{
  width:var(--sub-bar-w);
  border-right:1px solid var(--border);
  display:flex;align-items:center;
  padding:0 16px;gap:10px;flex-shrink:0;
}
.tb-app-name{
  font-size:13px;font-weight:700;
  color:var(--text);letter-spacing:-.015em;
  line-height:1.2;white-space:nowrap;
}
.tb-app-sub{
  font-size:10px;color:var(--text3);
  letter-spacing:.04em;text-transform:uppercase;
  margin-top:2px;white-space:nowrap;
}
.tb-live-dot{
  width:6px;height:6px;border-radius:50%;
  background:var(--teal);
  box-shadow:0 0 6px var(--teal);
  flex-shrink:0;margin-left:auto;
}

/* ── Main strip ── */
.tb-strip{
  flex:1;display:flex;align-items:center;
  padding:0 18px;gap:8px;min-width:0;
}

/* page context */
.tb-page-ctx{
  display:flex;align-items:center;gap:10px;
  padding-right:18px;
  border-right:1px solid var(--border);
  flex-shrink:0;
}
.tb-page-pill{
  width:30px;height:30px;border-radius:8px;
  display:flex;align-items:center;justify-content:center;
  font-size:15px;flex-shrink:0;
}
.tb-page-label{font-size:13px;font-weight:600;color:var(--text);white-space:nowrap;}
.tb-page-sub2{font-size:10.5px;color:var(--text3);margin-top:1px;}

/* shortcuts */
.tb-shortcuts{
  display:flex;align-items:center;gap:5px;
  padding:0 14px;border-right:1px solid var(--border);
  flex-shrink:0;
}
.tb-sc{
  display:inline-flex;align-items:center;gap:6px;
  padding:0 12px;height:32px;
  border-radius:7px;border:1px solid var(--border);
  background:var(--surface);color:var(--text2);
  font-size:12px;font-weight:500;cursor:pointer;
  font-family:var(--font);transition:all .15s;white-space:nowrap;
}
.tb-sc i{font-size:14px;flex-shrink:0;}
.tb-sc:hover{background:var(--surface2);color:var(--text);border-color:var(--border2);}
.tb-sc.emp{color:var(--accent);border-color:rgba(88,166,255,.3);background:var(--accent-dim);}
.tb-sc.emp:hover{background:var(--accent);color:#fff;box-shadow:0 0 10px var(--accent-glow);}
.tb-sc.bike{color:var(--teal);border-color:rgba(57,211,83,.3);background:var(--teal-dim);}
.tb-sc.bike:hover{background:var(--teal);color:#fff;}
.tb-sc.adv{color:var(--amber);border-color:rgba(227,179,65,.3);background:var(--amber-dim);}
.tb-sc.adv:hover{background:var(--amber);color:#0d1117;}

/* spacer */
.tb-gap{flex:1;}

/* datetime */
.tb-clock{
  display:flex;align-items:center;gap:10px;
  padding:0 14px;height:32px;
  border-radius:7px;
  background:var(--bg3);border:1px solid var(--border);
  flex-shrink:0;
}
.tb-clock i{font-size:13px;color:var(--teal);}
.tb-time{font-family:var(--mono);font-size:13px;font-weight:600;color:var(--text);letter-spacing:.04em;}
.tb-clock-sep{width:1px;height:14px;background:var(--border2);}
.tb-date-txt{font-size:11px;color:var(--text2);white-space:nowrap;}

/* theme toggle */
.tb-theme{
  width:32px;height:32px;border-radius:7px;
  border:1px solid var(--border);background:var(--surface);
  color:var(--text2);cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  font-size:15px;transition:all .15s;flex-shrink:0;
}
.tb-theme:hover{background:var(--surface2);color:var(--text);}

/* user chip */
.tb-user{
  display:flex;align-items:center;gap:8px;
  padding:0 12px;height:32px;
  border-radius:7px;
  border:1px solid var(--border);background:var(--surface);
  cursor:pointer;transition:all .15s;flex-shrink:0;
}
.tb-user:hover{background:var(--surface2);border-color:var(--border2);}
.tb-avatar{
  width:22px;height:22px;border-radius:50%;
  background:linear-gradient(135deg,var(--purple),#6e40c9);
  display:flex;align-items:center;justify-content:center;
  color:#fff;font-size:9px;font-weight:700;flex-shrink:0;
}
.tb-uname{font-size:12px;font-weight:600;color:var(--text);line-height:1.1;}
.tb-urole{font-size:10px;color:var(--text3);}
.tb-udot{
  width:6px;height:6px;border-radius:50%;
  background:var(--teal);box-shadow:0 0 5px var(--teal);
  margin-left:2px;flex-shrink:0;
}

/* sep */
.tb-vsep{width:1px;height:20px;background:var(--border);flex-shrink:0;}

/* ═══ BODY ROW ═══ */
.body-row{flex:1;display:flex;overflow:hidden;}

/* ─── ICON BAR ─── */
#icon-bar{
  width:var(--icon-bar-w);
  background:var(--bg2);border-right:1px solid var(--border);
  display:flex;flex-direction:column;align-items:center;
  padding:10px 0;gap:3px;
  flex-shrink:0;z-index:110;position:relative;
}
#icon-bar::after{
  content:'';position:absolute;top:0;right:-1px;
  width:1px;height:100%;
  background:linear-gradient(to bottom,var(--accent-glow),transparent 55%);
  pointer-events:none;
}
.ib-divider{width:26px;height:1px;background:var(--border);margin:4px 0;}
.ib-spacer{flex:1;}
.ib-btn{
  position:relative;width:36px;height:36px;
  border-radius:var(--radius);border:none;
  background:transparent;color:var(--text2);
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  font-size:18px;transition:background .15s,color .15s;
}
.ib-btn:hover{background:var(--surface);color:var(--text);}
.ib-btn.active{background:var(--accent-dim);color:var(--accent);}
.ib-tip{
  position:absolute;left:calc(100% + 10px);top:50%;
  transform:translateY(-50%);
  background:var(--surface2);color:var(--text);
  font-size:11.5px;padding:5px 10px;border-radius:6px;
  white-space:nowrap;pointer-events:none;opacity:0;
  transition:opacity .15s;border:1px solid var(--border2);
  z-index:300;font-family:var(--font);
}
.ib-btn:hover .ib-tip{opacity:1;}

/* ─── SUB BAR ─── */
#sub-bar{
  width:var(--sub-bar-w);
  background:var(--bg2);border-right:1px solid var(--border);
  display:flex;flex-direction:column;
  flex-shrink:0;overflow:hidden;
  transition:width .25s cubic-bezier(.4,0,.2,1);z-index:100;
}
#sub-bar.collapsed{width:0;}
.sb2-header{
  padding:14px 14px 10px;
  font-size:10px;font-weight:700;
  letter-spacing:.1em;text-transform:uppercase;color:var(--text3);
  border-bottom:1px solid var(--border);flex-shrink:0;white-space:nowrap;
  display:flex;align-items:center;gap:8px;
}
.sb2-header i{font-size:14px;color:var(--accent);}
.sb2-nav{flex:1;overflow-y:auto;padding:8px;}
.sb2-nav::-webkit-scrollbar{width:3px;}
.sb2-nav::-webkit-scrollbar-thumb{background:var(--border2);border-radius:4px;}
.sb2-section{
  font-size:9.5px;font-weight:700;letter-spacing:.1em;
  text-transform:uppercase;color:var(--text3);
  padding:10px 10px 4px;
}
.sb2-item{
  display:flex;align-items:center;gap:9px;
  padding:8px 10px;border-radius:var(--radius);
  cursor:pointer;font-size:12.5px;color:var(--text2);
  transition:all .15s;user-select:none;white-space:nowrap;
  border:1px solid transparent;margin-bottom:2px;
}
.sb2-item i{font-size:15px;flex-shrink:0;}
.sb2-item:hover{background:var(--surface);color:var(--text);border-color:var(--border);}
.sb2-item.active{background:var(--accent-dim);color:var(--accent);border-color:rgba(88,166,255,.2);font-weight:500;}
.sb2-badge{
  margin-left:auto;font-size:9.5px;font-weight:700;
  padding:1px 6px;border-radius:10px;
  background:var(--red-dim);color:var(--red);
}

/* ─── MAIN FRAME ─── */
.main-area{flex:1;overflow:hidden;display:flex;flex-direction:column;}
#main-frame{flex:1;border:none;background:var(--bg);width:100%;height:100%;}

/* ═══ MOBILE ═══ */
@media(max-width:768px){
  .tb-app{display:none;}
  .tb-page-ctx{display:none;}
  .tb-shortcuts{display:none;}
  .tb-date-txt{display:none;}
  #sub-bar{position:fixed;left:var(--icon-bar-w);top:0;height:100%;z-index:99;}
}
</style>
</head>

<body>
<div class="shell">

  <!-- ══════════════════════════════════════
       TOPBAR
       ══════════════════════════════════════ -->
  <header class="topbar">

    <!-- Fleet mgmt icon — brand corner -->
    <div class="tb-brand">
      <div class="tb-brand-icon" title="Fleet Management System">
        <i class="ti ti-truck"></i>
      </div>
    </div>

    <!-- App name (under sub-bar width) -->
    <div class="tb-app">
      <div>
        <div class="tb-app-name">AdminPro UAE</div>
        <div class="tb-app-sub">HR &amp; Fleet Management</div>
      </div>
      <div class="tb-live-dot" title="System online"></div>
    </div>

    <!-- Main strip -->
    <div class="tb-strip">

      <!-- Current page context -->
      <div class="tb-page-ctx">
        <div class="tb-page-pill" id="tb-pill" style="background:var(--accent-dim);color:var(--accent);">
          <i class="ti ti-users" id="tb-pill-i"></i>
        </div>
        <div>
          <div class="tb-page-label" id="tb-page-label">Employees</div>
          <div class="tb-page-sub2" id="tb-page-sub2">Staff directory</div>
        </div>
      </div>

      <!-- Quick action shortcuts -->
      <div class="tb-shortcuts">
        <button class="tb-sc emp"
          onclick="loadPage('Reg/addEmp.html',null,'Add Employee','ti-user-plus','Register new employee','var(--accent-dim)','var(--accent)')">
          <i class="ti ti-user-plus"></i> Add Employee
        </button>
		

        <button class="tb-sc bike"
          onclick="loadPage('Reg/addBike.html',null,'Add Bike','ti-motorbike','Register vehicle','teal')">
          <i class="ti ti-motorbike"></i> Add Bike
        </button>
		
		  <!-- <button class="tb-sc adv" onclick="run()"> <i class="ti ti-cash"></i> REF </button> -->

		  <button class="tb-sc adv" onclick="run()"><i class="ti ti-cash"></i> Run </button><span id="statusText"></span>
		  		  
      </div>

      <div class="tb-gap"></div>

      <!-- Live clock + date -->
      <div class="tb-clock">
        <i class="ti ti-clock"></i>
        <span class="tb-time" id="tb-time">00:00:00</span>
        <div class="tb-clock-sep"></div>
        <span class="tb-date-txt" id="tb-date">Wed, 1 Jan 2025</span>
      </div>

      <div class="tb-vsep"></div>

      <!-- Theme toggle -->
      <button class="tb-theme" onclick="toggleTheme()" title="Toggle theme">
        <i class="ti ti-moon" id="theme-icon"></i>
      </button>

      <div class="tb-vsep"></div>

      <!-- User chip -->
      <div class="tb-user" title="Signed in as Admin">
        <div class="tb-avatar">AD</div>
        <div>
          <div class="tb-uname">Admin</div>
          <div class="tb-urole">Super Admin</div>
        </div>
        <div class="tb-udot"></div>
      </div>

    </div>
  </header>

  <!-- ══════════════════════════════════════
       BODY ROW
       ══════════════════════════════════════ -->
  <div class="body-row">

    <!-- ICON BAR -->
    <nav id="icon-bar" aria-label="Navigation">

      <div class="ib-divider"></div>

      <button class="ib-btn active" id="ib-emp"
        onclick="ibOpen('ib-emp',this)" title="Employees">
        <i class="ti ti-users"></i>
        <span class="ib-tip">Employees</span>
      </button>

      <button class="ib-btn" id="ib-bike"
        onclick="ibOpen('ib-bike',this)" title="Bike Fleet">
        <i class="ti ti-motorbike"></i>
        <span class="ib-tip">Bike Fleet</span>
      </button>

      <button class="ib-btn" id="ib-adv"
        onclick="ibOpen('ib-adv',this)" title="Advance Salary">
        <i class="ti ti-cash"></i>
        <span class="ib-tip">Advance Salary</span>
      </button>

      <button class="ib-btn" id="ib-docs"
        onclick="ibOpen('ib-docs',this)" title="Expiring Docs">
        <i class="ti ti-file-alert"></i>
        <span class="ib-tip">Expiring Docs</span>
      </button>

      <div class="ib-spacer"></div>
      <div class="ib-divider"></div>

      <button class="ib-btn" onclick="toggleTheme()" title="Toggle theme">
        <i class="ti ti-moon" id="ib-theme-icon"></i>
        <span class="ib-tip">Toggle theme</span>
      </button>

    </nav>

    <!-- SUB BAR -->
    <div id="sub-bar">
      <div class="sb2-header">
        <i class="ti ti-users" id="sb2-icon"></i>
        <span id="sb2-title">Employees</span>
      </div>
      <div class="sb2-nav" id="sb2-nav"></div>
    </div>

    <!-- IFRAME -->
    <div class="main-area">
      <iframe id="main-frame" src="Reg/allEmp.html" title="Content"></iframe>
    </div>

  </div>

</div>

<script>
'use strict';

/* ══ SECTION MAP ══ */
const SECTIONS = {
  'ib-emp': {
    icon:'ti-users', label:'Employees',
    pageLabel:'Employees', pageSub:'Staff directory',
    pillBg:'var(--accent-dim)', pillColor:'var(--accent)', pillIcon:'ti-users',
    groups:[
      { label:'Directory', items:[
        { label:'Employee List', file:'Reg/allEmp.html',    icon:'ti-list',      sub:'All staff records'    },
        { label:'Add Employee',  file:'Reg/addEmp.html',      icon:'ti-user-plus', sub:'Register new employee'},
      ]},
      { label:'Documents', items:[
        { label:'Expiring Docs', file:'Reg/empExp.html', icon:'ti-file-x',    sub:'Visa · EID · Labour', badge:true },
      ]},
    ],
  },
  'ib-bike': {
    icon:'ti-motorbike', label:'Bike Fleet',
    pageLabel:'Bike Fleet', pageSub:'Fleet registry',
    pillBg:'var(--teal-dim)', pillColor:'var(--teal)', pillIcon:'ti-motorbike',
    groups:[
      { label:'Fleet', items:[
        { label:'Bike List',      file:'Reg/allBike.html',          icon:'ti-list',      sub:'All registered bikes' },
        { label:'Register Bike',  file:'Reg/addBike.html',       icon:'ti-plus',      sub:'Add new vehicle'      },
      ]},
      { label:'Documents', items:[
        { label:'Expiring Docs',  file:'Reg/bikExp.html',  icon:'ti-file-x',    sub:'Mulkiya · Insurance',  badge:true },
      ]},
    ],
  },
  'ib-adv': {
    icon:'ti-cash', label:'Advance Salary',
    pageLabel:'Advance Salary', pageSub:'Salary advances',
    pillBg:'var(--amber-dim)', pillColor:'var(--amber)', pillIcon:'ti-cash',
    groups:[
      { label:'Salary', items:[
		  { label: 'All Requests',    file: 'Reg/penReq.html', icon: 'ti-clipboard-list', sub: 'Advance history' },
		  { label: 'New Request',     file: 'Reg/finQue.html', icon: 'ti-cash',            sub: 'Submit an advance' },
		  { label: 'Recovery Module', file: 'Reg/recMod.html', icon: 'ti-wallet',          sub: 'Recovery details' },
      ]},
    ],
  },
  'ib-docs': {
    icon:'ti-file-alert', label:'Expiring Docs',
    pageLabel:'Expiring Docs', pageSub:'Document tracker',
    pillBg:'var(--red-dim)', pillColor:'var(--red)', pillIcon:'ti-file-alert',
    groups:[
      { label:'Expiry Tracker', items:[
        { label:'Employee Docs',  file:'pages/empExp.html',  icon:'ti-users',     sub:'Visa · EID · Labour',  badge:true },
        { label:'Bike Docs',      file:'pages/bikExp.html', icon:'ti-motorbike', sub:'Mulkiya · Insurance',   badge:true },
      ]},
    ],
  },
};

let activeSection = null;
let subOpen = true;

/* ── Open icon section ── */
function ibOpen(id, btn) {
  const sec = SECTIONS[id];
  if (!sec) return;
  const sb = document.getElementById('sub-bar');

  if (activeSection === id && subOpen) {
    subOpen = false; sb.classList.add('collapsed'); return;
  }

  document.querySelectorAll('.ib-btn').forEach(b => b.classList.remove('active'));
  if (btn) btn.classList.add('active');

  document.getElementById('sb2-icon').className = 'ti ' + sec.icon;
  document.getElementById('sb2-title').textContent = sec.label;

  const nav = document.getElementById('sb2-nav');
  nav.innerHTML = sec.groups.map(g => `
    <div class="sb2-section">${g.label}</div>
    ${g.items.map(item => `
      <div class="sb2-item" onclick="loadPage('${item.file}',this,'${item.label}','${item.icon||sec.icon}','${item.sub}','${sec.pillBg.replace(/'/g,'"')}','${sec.pillColor}')">
        <i class="ti ${item.icon}"></i>${item.label}
        ${item.badge ? '<span class="sb2-badge">!</span>' : ''}
      </div>`).join('')}
  `).join('');

  setCtx(sec.pageLabel, sec.pageSub, sec.pillBg, sec.pillColor, sec.pillIcon);
  subOpen = true; sb.classList.remove('collapsed');
  activeSection = id;
}

/* ── Load page ── */
function loadPage(file, el, label, icon, sub, pillBg, pillColor) {
  const frame = document.getElementById('main-frame');
  document.querySelectorAll('.sb2-item').forEach(i => i.classList.remove('active'));
  if (el) el.classList.add('active');
  if (!frame.src.endsWith(file)) frame.src = file;
  if (label) setCtx(label, sub||'', pillBg||'var(--accent-dim)', pillColor||'var(--accent)', icon||'ti-circle');
}

/* ── Update topbar page context ── */
function setCtx(label, sub, bg, color, iconCls) {
  const pill = document.getElementById('tb-pill');
  const pillI = document.getElementById('tb-pill-i');
  const lbl = document.getElementById('tb-page-label');
  const s = document.getElementById('tb-page-sub2');
  if (pill)  { pill.style.background = bg; pill.style.color = color; }
  if (pillI) pillI.className = 'ti ' + iconCls;
  if (lbl)   lbl.textContent = label;
  if (s)     s.textContent   = sub;
}

/* ── Theme ── */
function toggleTheme() {
  const html = document.documentElement;
  const dark = html.getAttribute('data-theme') !== 'light';
  html.setAttribute('data-theme', dark ? 'light' : 'dark');
  ['theme-icon','ib-theme-icon'].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.className = dark ? 'ti ti-sun' : 'ti ti-moon';
  });
  localStorage.setItem('theme', dark ? 'light' : 'dark');
}

/* ── Clock ── */
(function tick() {
  const now = new Date();
  const pad = n => String(n).padStart(2,'0');
  const t = document.getElementById('tb-time');
  const d = document.getElementById('tb-date');
  if (t) t.textContent = `${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;
  if (d) {
    const days  = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
    const months= ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    d.textContent = `${days[now.getDay()]} ${now.getDate()} ${months[now.getMonth()]} ${now.getFullYear()}`;
  }
  setTimeout(tick, 1000);
})();

/* ── Init ── */
window.addEventListener('DOMContentLoaded', () => {
  const saved = localStorage.getItem('theme') || 'dark';
  document.documentElement.setAttribute('data-theme', saved);
  ['theme-icon','ib-theme-icon'].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.className = saved === 'light' ? 'ti ti-sun' : 'ti ti-moon';
  });
  ibOpen('ib-emp', document.getElementById('ib-emp'));
});


function run() {
  const script = document.createElement("script");

  script.src =
    "https://script.google.com/macros/s/AKfycbxWQJHU1rki525yroOkb8_zl32SapvAbpwVEhCfVo2aEEc4QCiY7u8vP1WWNefKqpf6Gw/exec?action=run&callback=handleResponse";

  document.body.appendChild(script);
}

function handleResponse(data) {
  console.log(data);

  const status = document.getElementById("statusText");

  if (!status) return;

  if (data.success) {
    status.innerText = `✅ ${data.newCount || 0} records processed`;
  } else {
    status.innerText = `❌ ${data.error || data.message}`;
  }
}
